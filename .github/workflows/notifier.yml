name: HP OMEN Giveaway Notifier

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore posted.json
        uses: actions/cache@v4
        with:
          path: posted.json
          key: posted-${{ github.run_id }}
          restore-keys: |
            posted-

      - name: Create posted.json if missing
        run: |
          if [ ! -f posted.json ]; then
            echo '{"seen":[]}' > posted.json
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run notifier
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          ROLE_ID: ${{ secrets.ROLE_ID }}
        run: |
          python main.py

      - name: Commit updated posted.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add posted.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update posted history"
            git push
          fi
